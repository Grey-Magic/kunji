- name: mercadopago
  category: payments
  key_prefixes: ["APP_USR-"]
  key_patterns: ["^APP_USR-[A-Za-z0-9-]+$"]
  validation:
    method: GET
    url: "https://api.mercadopago.com/v1/payment_methods"
    auth: "bearer"
  detection:
    min_score: 200

- name: axiom
  category: monitoring
  key_prefixes: ["xaat-"]
  key_patterns: ["^xaat-[A-Za-z0-9_-]{10,}$"]
  validation:
    method: GET
    url: "https://api.axiom.co/v2/datasets"
    auth: "bearer"
  detection:
    min_score: 200
